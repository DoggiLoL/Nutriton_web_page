<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Сторінку не знайдено - Анна Коваленко</title>
    <link rel="icon" type="image/png" href="/img/icon.png" />

    <!-- Шрифты: заранее открываем соединение, чтобы текст появился быстрее -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,300..800;1,400&display=swap"
    />
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <main class="not-found">
      <div class="container not-found__container">
        <a href="/" class="header__logo not-found__logo">Anna Kovalenko</a>

        <p class="not-found__code">404</p>

        <h1 class="not-found__title">
          Сторінку <span>не знайдено</span>
        </h1>
        <p class="not-found__text">
          Можливо, посилання застаріло або в адресі є помилка.
        </p>

        <p class="not-found__title not-found__title--en" lang="en">
          Page <span>not found</span>
        </p>
        <p class="not-found__text" lang="en">
          The link may be outdated, or there may be a typo in the address.
        </p>

        <div class="not-found__actions">
          <a href="/" class="btn btn--filled">На головну</a>
          <a href="/en/" class="btn btn--outline" lang="en">Home page</a>
        </div>
      </div>
    </main>
  </body>
</html>
